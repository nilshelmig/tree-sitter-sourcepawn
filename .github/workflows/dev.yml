name: Test grammar and build wasm

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Get package version
        run: node -p -e '`PACKAGE_VERSION=${require("./package.json").version}`' >> $GITHUB_ENV
      - run: npm install
      - name: Setup wasi-sdk cache
        id: wasi-sdk
        uses: actions/cache@v6
        with:
          path: wasi-sdk
          key: wasi-sdk-29.0-${{ runner.os }}
      - if: steps.wasi-sdk.outputs.cache-hit != 'true'
        name: Install wasi-sdk
        uses: bytecodealliance/setup-wasi-sdk-action@77d09f3df1e8da344d8403cf8631af8977938b4c
        with:
          version: "29"
          install-path: wasi-sdk
      - name: Build parser
        run: npm run generate
      - name: Run tests
        run: npm run test
      - name: Build .wasm
        env:
          TREE_SITTER_WASI_SDK_PATH: wasi-sdk
        run: npm run build:wasm
      - name: Smoke test .wasm with web-tree-sitter
        run: |
          npm install --no-save web-tree-sitter
          node scripts/smoke-test-wasm.mjs
